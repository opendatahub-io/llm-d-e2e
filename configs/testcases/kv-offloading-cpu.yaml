name: kv-offloading-cpu
description: "KV-cache offloading to CPU memory (lru eviction)"
model:
  name: Qwen/Qwen3-0.6B
  uri: hf://Qwen/Qwen3-0.6B
  displayName: qwen3-0.6b-kv-offloading-cpu
  category: kv-cache-offloading
  cache:
    enabled: true
    storageSize: 10Gi
    keepPVC: true
    timeout: 15m
deployment:
  manifestPath: kv-offloading-cpu.yaml
  replicas: 1
  requiresGpu: true
  readyTimeout: 10m
  resources:
    cpu: "4"
    memory: 32Gi
    gpus: 1
    rdma: false
validation:
  healthEndpoint: /health
  healthPort: 8000
  healthScheme: HTTPS
  inferenceCheck: true
  testPrompts:
    - "Why we need kv-cache offloading for llm-d better?"
  # Repeat (unique per iteration) to overflow the GPU cache so it offloads to the CPU tier.
  inferenceRepeat: 60
  expectedCodes: [200]
  timeout: 2m
  retryAttempts: 3
  retryInterval: 15s
  metricsCheck:
    enabled: true
    checkVLLM: true
    checkScheduler: true
    checkKvcacheOffloading: true
cleanup: true
